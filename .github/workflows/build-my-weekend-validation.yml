name: BUILD MY WEEKEND validation

on:
  push:
    branches:
      - main
      - fishing-away-integration
  pull_request:
    branches:
      - main

jobs:
  tomtom-routing-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test TomTom routing Worker validation and error handling
        run: node --test artifacts/routing-worker/test/*.test.js

  data-ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test bulk OSM campsite importer
        run: python -m unittest discover -s scripts/data-ingestion -p 'test_*.py' -v

  bathymetry-detection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bathymetry/requirements.txt
      - name: Install GeoTIFF processing dependencies
        run: python -m pip install -r scripts/bathymetry/requirements.txt
      - name: Test GeoTIFF detection and WGS84 GeoJSON export
        run: python -m unittest discover -s scripts/bathymetry -p 'test_*.py' -v

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check artifacts/build-my-weekend/js/app.js
          node --check artifacts/build-my-weekend/js/fishing.js
          node --check artifacts/build-my-weekend/js/accommodation.js
          node --check artifacts/build-my-weekend/js/camping.js

  structural-smoke:
    runs-on: ubuntu-latest
    needs: javascript-syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run structural smoke test
        run: node scripts/validate-build-my-weekend.mjs

  production-build:
    runs-on: ubuntu-latest
    env:
      PORT: 5000
      BASE_PATH: /Build-My-Weekend/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web app
        run: pnpm --filter @workspace/build-my-weekend build
      - name: Verify production artifact contents
        run: node scripts/validate-build-my-weekend-production.mjs
      - name: Type-check production web app
        run: pnpm --filter @workspace/build-my-weekend typecheck

  browser-smoke:
    runs-on: ubuntu-latest
    needs: production-build
    env:
      PORT: 5000
      BASE_PATH: /Build-My-Weekend/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web app for isolated browser runner
        run: pnpm --filter @workspace/build-my-weekend build
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix /tmp/bmw-browser playwright
          /tmp/bmw-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start production preview
        run: |
          pnpm --filter @workspace/build-my-weekend exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/bmw-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/Build-My-Weekend/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/bmw-preview.log
          exit 1
      - name: Test the real browser journey
        env:
          NODE_PATH: /tmp/bmw-browser/node_modules
          BMW_BASE_URL: http://127.0.0.1:4173/Build-My-Weekend/
        run: node scripts/browser-smoke-build-my-weekend.cjs
