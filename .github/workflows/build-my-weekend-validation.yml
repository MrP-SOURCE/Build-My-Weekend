name: BUILD MY WEEKEND validation

on:
  push:
    branches:
      - main
      - fishing-away-integration
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check artifacts/build-my-weekend/js/app.js
          node --check artifacts/build-my-weekend/js/fishing.js
          node --check artifacts/build-my-weekend/js/accommodation.js
          node --check artifacts/build-my-weekend/js/camping.js

  structural-smoke:
    runs-on: ubuntu-latest
    needs: javascript-syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run structural smoke test
        run: node scripts/validate-build-my-weekend.mjs

  production-build:
    runs-on: ubuntu-latest
    env:
      PORT: 5000
      BASE_PATH: /Build-My-Weekend/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web app
        run: pnpm --filter @workspace/build-my-weekend build
      - name: Type-check production web app
        run: pnpm --filter @workspace/build-my-weekend typecheck
