name: Deploy BUILD MY WEEKEND routing Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-routing-worker:
    name: Deploy protected routing Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config artifacts/routing-worker/wrangler.toml
